name: Signed APK

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
          cache: gradle

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Sign and verify APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for secret in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing repository secret $secret"
              exit 1
            fi
          done

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one release APK, found ${#apks[@]}"
            exit 1
          fi

          keystore=$(mktemp "$RUNNER_TEMP/ytsave-keystore.XXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          aligned_apk="$RUNNER_TEMP/ytsave-aligned.apk"
          signed_apk="$RUNNER_TEMP/YTSave-release.apk"
          "$build_tools/zipalign" -P 16 -f 4 "${apks[0]}" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$build_tools/apksigner" verify "$signed_apk"

      - name: Upload signed APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/YTSave-release.apk
          archive: false
          if-no-files-found: error
